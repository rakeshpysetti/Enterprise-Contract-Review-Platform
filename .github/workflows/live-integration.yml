name: Live stack verification

on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to download and evaluate
        required: true
        default: qwen2.5:0.5b

permissions:
  contents: read

jobs:
  live-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_MODEL: ${{ inputs.model }}
      OLLAMA_TIMEOUT_SECONDS: "300"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integration runner
        run: python -m pip install httpx pymupdf
      - name: Configure ephemeral test credentials
        run: |
          python - <<'PY'
          import hashlib, json, os, secrets
          password = secrets.token_urlsafe(32)
          token = secrets.token_urlsafe(32)
          print(f"::add-mask::{password}")
          print(f"::add-mask::{token}")
          accounts = json.dumps([dict(user_id="ci", tenant_id="ci", role="reviewer", token_sha256=hashlib.sha256(token.encode()).hexdigest())])
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"POSTGRES_PASSWORD={password}\nCONTRACT_REVIEW_ACCESS_KEY={token}\nAUTH_ACCOUNTS={accounts}\n")
          PY
      - name: Validate production configuration
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Start PostgreSQL and Ollama
        run: docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 300 postgres ollama
      - name: Pull the selected model
        run: docker compose -f docker-compose.prod.yml exec -T ollama ollama pull "$OLLAMA_MODEL"
      - name: Apply migrations and start API
        run: docker compose -f docker-compose.prod.yml up --build -d --wait --wait-timeout 300 api
      - name: Verify recovery under real PostgreSQL row locks
        run: docker compose -f docker-compose.prod.yml exec -T api python - < scripts/verify_postgres_recovery.py
      - name: Verify PostgreSQL backup and isolated restore
        run: python scripts/verify_postgres_backup.py
      - name: Verify live pipeline and record actual model metrics
        run: python scripts/evaluate_live.py --output-dir data/evaluation/live_runs/ci
      - name: Retain predictions and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-model-evaluation
          path: data/evaluation/live_runs/ci/
          if-no-files-found: ignore
      - name: Stop ephemeral stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down --volumes
