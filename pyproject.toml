[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-contract-review-platform"
version = "0.1.0"
description = "Enterprise contract review and obligation extraction API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=5,<6",
    "faiss-cpu>=1.12,<2",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4.2,<5"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
