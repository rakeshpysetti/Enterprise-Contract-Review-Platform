[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-contract-review-platform"
version = "0.1.0"
description = "Enterprise contract review and obligation extraction API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.20,<1",
    "sentence-transformers>=5,<6",
    "faiss-cpu>=1.12,<2",
    "numpy>=1.26,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8,<10",
    "reportlab>=4.2,<5",
    "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "skip"
mypy_path = "backend"
files = ["backend/app", "scripts"]
explicit_package_bases = true
incremental = false
